group = "com.terrapay.paybywallet_flutter"
version = "1.0.0"

buildscript {
    ext.kotlin_version = "2.2.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.13.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

// AGP rejects `implementation files("...aar")` inside a library module
// ("Direct local .aar file dependencies are not supported when building an
// AAR"). Exposing libs/ as a flatDir repository makes the SDK resolve as a
// normal module dependency instead, which does get packaged into the app.
def payByWalletLibs = "$projectDir/libs"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // sdp-compose, a transitive dependency of the PayByWallet .aar.
        maven { url = uri("https://jitpack.io") }
        flatDir { dirs payByWalletLibs }
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.terrapay.paybywallet_flutter"
    // The PayByWallet SDK targets compileSdk 36.
    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // The SDK requires API 28+.
        minSdk = 28
        // Applied to the consuming app's R8 pass. The shipped .aar carries no
        // proguard.txt of its own, so without this every app embedding it would
        // have to copy the SDK's keep rules by hand -- and getting them wrong
        // silently breaks Gson in release builds only.
        consumerProguardFiles("consumer-rules.pro")
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
        }
    }
}

dependencies {
    // The PayByWallet SDK, vendored as a local .aar (via the flatDir repo above).
    implementation name: "payByWallet-release", ext: "aar"

    // A local .aar carries no POM, so the SDK's transitive dependencies are
    // declared here by hand. Derived with `jdeps -verbose:package` over the
    // .aar's classes.jar and cross-checked against the SDK module's own
    // build.gradle.kts. Re-verify whenever the .aar is refreshed.
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation "com.github.Kaaveh:sdp-compose:1.1.0"

    implementation "androidx.core:core-ktx:1.15.0"
    implementation "androidx.appcompat:appcompat:1.7.1"
    implementation "androidx.activity:activity-ktx:1.12.0"
    implementation "androidx.activity:activity-compose:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"

    implementation platform("androidx.compose:compose-bom:2025.11.01")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.runtime:runtime"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.navigation:navigation-compose:2.8.9"
    implementation "com.google.accompanist:accompanist-systemuicontroller:0.36.0"
    implementation "com.airbnb.android:lottie-compose:6.4.1"

    implementation "io.github.raamcosta.compose-destinations:core:1.9.62"
    implementation "io.github.raamcosta.compose-destinations:animations-core:1.9.62"

    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation "com.squareup.okhttp3:okhttp:5.0.0-alpha.12"
    implementation "com.squareup.okhttp3:okhttp-sse:5.0.0-alpha.12"
    implementation "com.squareup.okhttp3:logging-interceptor:5.0.0-alpha.12"

    implementation "androidx.camera:camera-camera2:1.5.1"
    implementation "androidx.camera:camera-lifecycle:1.5.1"
    implementation "androidx.camera:camera-view:1.5.1"
    implementation "com.google.mlkit:barcode-scanning:17.3.0"
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
    implementation "com.google.zxing:core:3.5.4"
}
